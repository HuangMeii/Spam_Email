<div class="container lstm-flow">
  <div class="flow" role="list" aria-label="LSTM steps">

    <div class="step" role="listitem" data-step="0">
      <div class="title">hₜ₋₁, xₜ</div>
      <div class="subtitle">Input</div>
    </div>

    <div class="arrow" aria-hidden="true">→</div>

    <div class="step" role="listitem" data-step="1">
      <div class="title">Forget Gate</div>
      <div class="subtitle">fₜ</div>
    </div>

    <div class="arrow" aria-hidden="true">→</div>

    <div class="step" role="listitem" data-step="2">
      <div class="title">Input Gate</div>
      <div class="subtitle">iₜ</div>
    </div>

    <div class="arrow" aria-hidden="true">→</div>

    <div class="step" role="listitem" data-step="3">
      <div class="title">Candidate</div>
      <div class="subtitle">C̃ₜ</div>
    </div>

    <div class="arrow" aria-hidden="true">→</div>

    <div class="step" role="listitem" data-step="4">
      <div class="title">Cell State</div>
      <div class="subtitle">Cₜ</div>
    </div>

    <div class="arrow" aria-hidden="true">→</div>

    <div class="step" role="listitem" data-step="5">
      <div class="title">Output Gate</div>
      <div class="subtitle">oₜ → hₜ</div>
    </div>

  </div>


</div>
